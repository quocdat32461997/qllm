[project]
name = "qllm"
version = "0.1.0"
description = "LLM semantic IDs and sequential recommendation on Amazon 2014"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "datasets==3.0.0",
    "huggingface-hub>=1.6.0",
    "peft>=0.19.1",
    "pyyaml>=6.0.3",
    "torch==2.7.1",
    "transformers>=5.3.0",
    "wandb>=0.25.0",
]

[project.optional-dependencies]
gpu = ["deepspeed>=0.16.0; sys_platform == 'linux'"]
legacy = ["bitsandbytes==0.50.0; sys_platform == 'linux'", "mlflow>=3.10.1"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
