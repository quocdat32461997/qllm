[project]
name = "qllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# Versions pinned for reproducibility / compatibility with the RunPod template
# runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404 (CUDA 12.8.1, torch 2.8.0, Python 3.12).
dependencies = [
    "bitsandbytes==0.50.0",
    "datasets==3.0.0",
    "huggingface-hub==1.16.1",
    "inspect-ai==0.3.248",
    "mlflow==3.14.0",
    "peft==0.19.1",
    "pyyaml==6.0.3",
    "torch==2.8.0",
    "transformers==5.14.1",
    "trl==0.29.1",
    "wandb==0.28.1",
]

[project.optional-dependencies]
# Multi-GPU memory sharding (ZeRO) for the Qwen3-8B configs
# (trainer.deepspeed: ds_configs/zero2.json). CUDA/Linux only — install on RunPod with
# `uv sync --extra gpu`; not needed for single-device runs (Apple Silicon / CPU / 1 GPU)
# where configs set `deepspeed: null`.
gpu = [
    "deepspeed==0.19.7",
]
